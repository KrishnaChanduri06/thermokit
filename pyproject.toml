[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermokit"
version = "0.1.0"
description = "Hand-calc thermal design for electronics cooling: chip stacks, heat sinks, cold plates"
readme = "README.md"
license = "MIT"
authors = [{ name = "Chanduri Sreekrishna Abhay" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "CoolProp", "ht", "fluids"]

[project.optional-dependencies]
app = ["streamlit", "matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
